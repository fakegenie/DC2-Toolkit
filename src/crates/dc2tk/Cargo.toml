[package]
name = "dc2tk"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "DC2-Toolkit: extract every Dark Chronicle (Dark Cloud 2) asset into formats you can edit, and rebuild a playable disc"

[[bin]]
name = "dc2tk"
path = "src/main.rs"

[dependencies]
dc2tk-assets.workspace = true
dc2tk-disc.workspace = true
dc2tk-script.workspace = true
anyhow.workspace = true
clap.workspace = true
indexmap.workspace = true
mimalloc.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
dc2tk-disc = { workspace = true, features = ["test-support"] }
