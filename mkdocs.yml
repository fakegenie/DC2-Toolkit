# The documentation site (docs/, built with Material for MkDocs and published to GitHub Pages by
# .github/workflows/docs.yml). The pages stay plain GitHub Markdown; tools/mkdocs_hooks.py points
# links that leave docs/ (src/docs/, definitions/, the examples' sources) at GitHub.
#
#   pip install -r tools/docs-requirements.txt && mkdocs serve

site_name: DC2-Toolkit
site_description: Extract, edit and mod DC2, and rebuild a playable disc.
site_url: https://fakegenie.github.io/DC2-Toolkit/
repo_url: https://github.com/fakegenie/DC2-Toolkit
repo_name: fakegenie/DC2-Toolkit
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

# the examples' sources, models and sounds are linked on GitHub, not copied into the site
exclude_docs: |
  scripting/examples/**/*.*
  !scripting/examples/**/README.md

hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  custom_dir: docs/.theme
  icon:
    logo: material/build-circle
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  # its slugify is GitHub's, set by tools/mkdocs_hooks.py, so a link that works there works here
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite

validation:
  links:
    anchors: warn

nav:
  - Home: README.md
  - Guide:
      - guide/README.md
      - CLI Reference: guide/commands.md
      - Creating Mods: guide/mods.md
      - Editing Assets:
          - Game Data (JSON): guide/data.md
          - Textures (PNG): guide/textures.md
          - Text and Menus: guide/text.md
          - Sound Effects (WAV): guide/sounds.md
          - Music (MIDI): guide/music.md
          - 3D Models (glTF): guide/models.md
          - Maps and Blender: guide/maps.md
          - Dungeons: guide/dungeons.md
      - Memory Limits: guide/memory.md
  - Scripting:
      - How Scripts Work & Lifecycle: scripting/README.md
      - Map, Monster, and Player Scripts: scripting/systems.md
      - C Language, SDK, and Patches: scripting/language.md
      - Example Guides:
          - scripting/tutorials/README.md
          - Change What an NPC Says: scripting/tutorials/npc-line.md
          - Change Enemy Behavior: scripting/tutorials/enemy-behaviour.md
          - Add a New Enemy: scripting/tutorials/new-enemy.md
          - Add a Cutscene: scripting/tutorials/cutscene.md
          - Tune Player Combat: scripting/tutorials/tune-player.md
          - Live Combat Captions: scripting/tutorials/captions.md
      - Example Mods:
          - The Spinning Cult: scripting/examples/spinning-cult/README.md
      - API Reference:
          - scripting/api/README.md
          - event.h (Maps & Cutscenes): scripting/api/event.md
          - monster.h (Monster AI): scripting/api/monster.md
          - action.h (Player Actions): scripting/api/action.md
          - effect.h (Effects): scripting/api/effect.md
          - arg.h (Event Arguments): scripting/api/arg.md
          - modkit (Mod Libraries): scripting/api/modkit.md
  - DC2 Internals:
      - internals/README.md
      - Disc Layout and Archives: internals/disc.md
      - Script Bytecode (.stb) and VM: internals/scripts.md
      - Script Execution and Runtime: internals/running.md
      - Maps (.map, .pcp, .mpk): internals/maps.md
      - Dungeon Floors: internals/dungeons.md
      - 3D Models and Motions (.mds, .mot): internals/models.md
      - Textures (.img, TIM2): internals/textures.md
      - Sound Banks (.snd): internals/sounds.md
      - Music Sequences (.sq): internals/music.md
      - Message Text (.mes): internals/text.md
      - Game Data Tables: internals/data.md
      - Memory Layout: internals/memory.md
